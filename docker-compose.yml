name: shopeemini

services:
  postgres:
    image: postgres:17
    container_name: shopeemini-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: shopee_mini
    ports:
      - "5432:5432"
    volumes:
      - shopeemini-postgres-data:/var/lib/postgresql/data

volumes:
  shopeemini-postgres-data:
    name: shopeemini-postgres-data
